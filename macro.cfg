[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # 1. Визначення безпечного підйому по осі Z (на 10 мм вгору)
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set z_pos = printer.toolhead.position.z|float %}
    {% if z_pos < (z_max - 10.0) %}
        {% set z_safe = 10.0 %}
    {% else %}
        {% set z_safe = z_max - z_pos %}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    
    # 2. Відкат пластику, щоб не капав на деталь
    G91
    G1 E-2 F2700                     
    
    # 3. Підйом сопла
    G1 Z{z_safe} F900                
    
    # 4. Паркування в безпечну зону для Ender 3 V3 SE (X10 Y10)
    G90
    G1 X10 Y10 F6000                 

[gcode_macro RESUME]
description: Нагрівання сопла, очищення об щітку та продовження друку
rename_existing: BASE_RESUME
gcode:
    ##### Перевірка та відновлення температури екструдера #####
    {% if printer.pause_resume.is_paused %}
        # Беремо температуру, яка була до паузи (якщо злетіла, то беремо поточну цільову)
        {% set target_temp = printer.pause_resume.extrude_temp|default(0)|float %}
        
        {% if target_temp > 0 %}
            M117 Нагрівання сопла до {target_temp}C...
            M109 S{target_temp}   ; Чекаємо на повний прогрів сопла
        {% endif %}
        
        M117 Очищення сопла...
        G90                           ; ПРИМУСОВО: абсолютні координати (захист від аварії)
        G1 X43 Y-13 Z10 F4500.0       ; Стаємо НАД початковою точкою щітки
        G1 Z4.5 F2250.0               ; Опускаємо сопло на робочу висоту Z4.5

        # Рух зигзагом ВПРАВО (X43 -> X90, Y від -13 до -8)
        G1 X50.8 Y-8 F4500.0          ; 1-й пік вгору
        G1 X58.6 Y-13 F4500.0         ; 1-й спад вниз
        G1 X66.4 Y-8 F4500.0          ; 2-й пік вгору
        G1 X74.2 Y-13 F4500.0         ; 2-й спад вниз
        G1 X82.0 Y-8 F4500.0          ; 3-й пік вгору
        G1 X90.0 Y-13 F4500.0         ; Фініш праворуч

        # Рух зигзагом НАЗАД ВЛІВО (X90 -> X43, Y від -13 до -8)
        G1 X82.0 Y-8 F4500.0          ; Повернення на 3-й пік
        G1 X74.2 Y-13 F4500.0         ; На 2-й спад
        G1 X66.4 Y-8 F4500.0          ; На 2-й пік
        G1 X58.6 Y-13 F4500.0         ; На 1-й спад
        G1 X50.8 Y-8 F4500.0          ; На 1-й пік
        G1 X43.0 Y-13 F4500.0         ; Повернення в початкову точку

        G1 Z15 F4500.0                ; Піднімаємо сопло вгору на безпечну висоту 15 мм

        # 1. Повернення пластику після паузи (лише якщо сопло гаряче)
        {% if printer.extruder.can_extrude|lower == 'true' %}
            G91
            G1 E0.2 F1800                    
            G90
        {% endif %}

        M117 Відновлення друку...
        # 2. Повернення на деталь у точну точку зупинки
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=60 
        BASE_RESUME
    {% else %}
        {action_respond_info("Принтер не на паузі, команда RESUME ігнорується")}
    {% endif %}


[gcode_macro M600]
gcode:
    PAUSE                ; Викликає наш безпечний макрос паузи з паркуванням
    UNLOAD_FILAMENT      ; Автоматично виштовхує старий пластик

[gcode_macro UNLOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=unload_state
	
	    # Перевірка: якщо температура сопла нижче 200°C, гріємо його до 220°C (універсальна температура)
    {% if printer.extruder.temperature < 200 %}
        M117 Heating nozzle...
        M109 S220
    {% endif %}
    
    M117 Filament unloading!
    G91                  
    G1 E1.5 F300           ; Продавлювання вперед, щоб розплавити кінчик
    G1 E-10 F3000        ; Швидкий різкий відкат, щоб не утворилося нитки
    G1 E-40 F1000        ; Повне вивантаження з екструдера Sprite
    M117 Filament unloaded!
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro LOAD_FILAMENT]
gcode:
    SAVE_GCODE_STATE NAME=load_state
		
	    # Перевірка: якщо температура сопла нижче 200°C, гріємо його до 220°C (універсальна температура)
    {% if printer.extruder.temperature < 200 %}
        M117 Heating nozzle...
        M109 S220
    {% endif %}
    
    G91                  
    G1 E40 F600          ; Швидка подача нового пластику в екструдер
    G1 E10 F200          ; Повільне продавлювання для очищення сопла
    M117 Filament loaded!
    RESTORE_GCODE_STATE NAME=load_state

