[gcode_macro START_PRINT]          # START_PRINT 
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}

    ; Ввімкнення датчиків філаменту
    M117 Контроль філаменту ввімкнено
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1 ; Put your filament sensor's name after SENSOR=
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1 ; Put your filament encoder's name after SENSOR=

    M140 S{BED_TEMP}
    G92 E0 ; Скинути значення екструдера
    G90 ; Абсолютні координати
    G28 ; Перемістити всі осі в початкові точки
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    M104 S{EXTRUDER_TEMP} ; Почати нагрів екструдера
    BED_MESH_CALIBRATE ; Калібрування стола перед друком
    M109 S{EXTRUDER_TEMP} ; Дочекатися нагріву екструдера

    CLEAN_ZIGZAG          ; Виклик макросу

    # ; Очистка сопла
    #  G1 X3 Y-13 Z10 F4500.0 ; Рух до очистки
    #  G1 X100 Y-13 Z4.5 F4500.0 ; Очистка 1
    #  G1 X30 Y-13 Z4.5 F4500.0 ; Очистка 2
    #  G1 X100 Y-11 Z4.5 F4500.0 ; Очистка 3
    #  G1 X30 Y-11 Z4.5 F4500.0 ; Очистка 4
    #  G1 X100 Y-13 Z4.5 F4500.0 ; Очистка 5
    #  G1 X30 Y-13 Z4.5 F4500.0 ; Очистка 6
    #  G1 X100 Y-11 Z4.5 F4500.0 ; Очистка 7
    #  G1 X30 Y-11 Z4.5 F4500.0 ; Очистка 8
    # # G1 X40 Y-11 Z15 F4500.0 ; Рух від очистки


    G1 Z5.0 F3000 ; Підняття осі Z вгору, щоб запобігти подряпинам термостійкої поверхні
    G1 X-6 Y20 Z0.3 F5000.0 ; Перейти у стартове положення
    #BEEP
    G1 X-6 Y200.0 Z0.3 F1500.0 E15 ; Намалювати першу лінію
    G1 X-1 Y200.0 Z0.3 F5000.0 ; Відійти вбік
    G1 X-2.5 Y20 Z0.3 F1500.0 E30 ; Намалювати другу лінію
    G92 E0 ; Скинути значення екструдера
    G1 Z2.0 F3000 ; Підняття осі Z вгору, щоб запобігти подряпинам термостійкої поверхні
    G1 X2 Y20 Z0.3 F5000.0 ; Посуньтеся, щоб запобігти злипанню крапель
    #BED_MESH_PROFILE LOAD=default


[gcode_macro LOW_TEMP_CHECK]
gcode:
    {% set extruder_temp = params.T|default(200)|float %}
    {% if printer.extruder.target > extruder_temp %}                            # if there is a setpoint for extruder
        {% set extruder_temp = printer.extruder.target %}
    {% endif %}
    {% if printer.extruder.temperature < extruder_temp %}                       # heat to the target
        M118 Heating to {extruder_temp}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
    {% endif %}

[gcode_macro BEEP]
gcode:
    {% set duration = params.P|default(100)|float %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{duration}
    SET_PIN PIN=beeper VALUE=0


[gcode_macro CANCEL_PRINT]
description: Скасування поточного друку з безпечним паркуванням
rename_existing: CANCEL_PRINT_BASE
gcode:
    M117 Printing cancelled...
    
    # 1. Вимикаємо нагрів та вентилятори
    TURN_OFF_HEATERS             ; Вимикає сопло та стіл
    M107                         ; Вимикає обдув деталі
    
    # 2. Безпечно піднімаємо голову, якщо принтер не на паузі
    {% if not printer.pause_resume.is_paused %}
        G91                      ; Відносні координати
        G1 E-4 F2700             ; Безпечний відкат пластику
        
        # Перевірка висоти Z, щоб не вдарити верхню рамку
        {% set z_max = printer.toolhead.axis_maximum.z|float %}
        {% set z_pos = printer.toolhead.position.z|float %}
        {% if z_pos < (z_max - 15.0) %}
            G1 Z15 F900          ; Підйом на 15 мм вгору від деталі
        {% else %}
            G1 Z{z_max - z_pos} F900
        {% endif %}
    {% endif %}
    
    # 3. Паркування для презентації деталі (для Ender 3 V3 SE)
    G90                          ; Абсолютні координати
    G1 X10 Y210 F6000            ; Екструдер ліворуч, стіл повністю виїжджає на вас
    
    # 4. Очищення датчиків філаменту (Тут вказані саме ваші два датчики зі скриншоту)
    M117 Filament control off
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0  
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0  
    
    # Очищення налаштувань шарів OrcaSlicer
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    
    # 5. Скидання стану в Klipper та офіційна зупинка друку
    CLEAR_PAUSE                  ; Очищає пам'ять паузи
    SDCARD_RESET_FILE            ; Скидає завантажений файл g-коду
    CANCEL_PRINT_BASE            ; Викликає саме вашу базову команду скасування



