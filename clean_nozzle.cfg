[gcode_macro CLEAN_ZIGZAG]
gcode:
    # 1. Безпечний підхід до початку зони щітки
    G1 X43 Y-13 Z10 F4500.0       ; Стаємо над початковою точкою (X43, Y-13)
    G1 Z4.5 F2250.0               ; Опускаємо сопло на робочу висоту Z4.5

    # 2. Початок циклу повторення (виконається 2 рази)
    {% for i in range(2) %}
        
        # Рух зигзагом ВПРАВО зі швидкістю F4500 (X43..90, Y від -13 до -8)
        G1 X50.8 Y-8 F4500.0          ; 1-й пік вгору (до Y-8)
        G1 X58.6 Y-13 F4500.0         ; 1-й спад вниз (до Y-13)
        G1 X66.4 Y-8 F4500.0          ; 2-й пік вгору
        G1 X74.2 Y-13 F4500.0         ; 2-й спад вниз
        G1 X82.0 Y-8 F4500.0          ; 3-й пік вгору
        G1 X90.0 Y-13 F4500.0         ; Фініш праворуч

        # Рух зигзагом НАЗАД ВЛІВО (від X90 до X43)
        G1 X82.0 Y-8 F4500.0          ; Повернення на 3-й пік
        G1 X74.2 Y-13 F4500.0         ; На 2-й спад
        G1 X66.4 Y-8 F4500.0          ; На 2-й пік
        G1 X58.6 Y-13 F4500.0         ; На 1-й спад
        G1 X50.8 Y-8 F4500.0          ; На 1-й пік
        G1 X43.0 Y-13 F4500.0         ; Повернення в початкову точку

         # Рух зигзагом ВПРАВО зі швидкістю F4500 (X43..90, Y від -13 до -8)
        G1 X50.8 Y-8 F4500.0          ; 1-й пік вгору (до Y-8)
        G1 X58.6 Y-13 F4500.0         ; 1-й спад вниз (до Y-13)
        G1 X66.4 Y-8 F4500.0          ; 2-й пік вгору
        G1 X74.2 Y-13 F4500.0         ; 2-й спад вниз
        G1 X82.0 Y-8 F4500.0          ; 3-й пік вгору
        G1 X90.0 Y-13 F4500.0         ; Фініш праворуч

        # Рух зигзагом НАЗАД ВЛІВО (від X90 до X43)
        G1 X82.0 Y-8 F4500.0          ; Повернення на 3-й пік
        G1 X74.2 Y-13 F4500.0         ; На 2-й спад
        G1 X66.4 Y-8 F4500.0          ; На 2-й пік
        G1 X58.6 Y-13 F4500.0         ; На 1-й спад
        G1 X50.8 Y-8 F4500.0          ; На 1-й пік
        G1 X43.0 Y-13 F4500.0         ; Повернення в початкову точку

    {% endfor %}
    # Кінець циклу

    # 3. Безпечний вихід із зони очищення
    G1 Z15 F4500.0                ; Піднімаємо сопло вгору на безпечну висоту 15 мм
